name: Paste wording review
on:
  push:
    branches: [fix/reliable-paste-pacing-and-safe-profiles]
    paths: [.github/workflows/paste-copy-review.yml]
permissions:
  contents: write
concurrency:
  group: paste-wording-review
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'WyrmKeep/jetkvm-reliable-paste-private'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - name: Correct completion wording and stale comments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/reliable-paste-pacing-and-safe-profiles'
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'ac0e4f7951299771be509569a52844dc1fe785ba', 'HEAD'], check=True)
          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, old, s.count(old))
              p.write_text(s.replace(old, new))
          def section(path, start, end, text):
              p = Path(path)
              s = p.read_text()
              assert s.count(start) == 1 and s.count(end) == 1
              a, b = s.index(start), s.index(end)
              assert a < b
              p.write_text(s[:a] + text + s[b:])
          hook = 'ui/src/hooks/useKeyboard.ts'
          modal = 'ui/src/components/popovers/PasteModal.tsx'
          section(hook, '// `pasteStateSupportObserved` tracks', 'let executePasteTextInFlight = false;', '''// Paste-state events are required for chunk-boundary drains. A negotiated
          // HID protocol version alone does not establish that capability. The
          // capability RPC can enable chunking on the first paste; otherwise the
          // observation latch enables it after an actual paste-state event.
          ''')
          section(hook, '        // Phase 2 chunk policy.', '        const policy = DEFAULT_LARGE_PASTE_POLICY;', '''        // Chunking requires ready HID-RPC and paste-state capability or a
                  // previously observed state event. The capability RPC can enable
                  // the first paste. Older HID firmware without either indication
                  // stays non-chunked; profile paste does not use legacy JSON-RPC.
          ''')
          section(hook, '              // Per-chunk derived drain timeout.', '              const chunkDrainTimeoutMs =', '''              // Derive the budget from the actual chunk and selected delay,
                        // with the encoder's reset-delay fallback and policy floor.
                        // This is a watchdog budget, not guaranteed host completion.
          ''')
          section(hook, '              // Intermediate chunks (ci < chunks.length - 1)', '              const drainStart = performance.now();', '''              // Intermediate chunks use the explicit 250ms chunk pause.
                        // Preserve the final chunk's 500ms settle grace. Neither
                        // delay nor backend drain certifies application receipt.
          ''')
          replace(hook, '''  // confirmed flushed through the backend (pasteDepth hit 0). A committed
            // prefix is a safe resume boundary: everything before it has been typed;
            // anything after it is in an unknown partial state. Only fires in chunk
            // mode — small pastes have no required drains and report no commits.''', '''  // flushed through the backend (pasteDepth hit 0), not confirmed received
            // by the application. Verify the prefix and trim any uncertain tail
            // before resuming. Only chunk mode reports committed boundaries.''')
          replace(hook, '   * Reserved for #38\'s chunk boundaries in Phase 2. No Phase 1 call sites.', '   * Used at chunk and repair boundaries.') if '   * Reserved for' in Path(hook).read_text() else None
          replace(hook, ' *   Reserved for #38\'s chunk boundaries in Phase 2. No Phase 1 call sites.', ' *   Used at chunk and repair boundaries.')
          replace(hook, '''              // The required drain resolved: every batch in this chunk has
                        // been flushed through the backend. Commit the prefix as a
                        // safe resume boundary.''', '''              // Record a device-drained checkpoint, not verified target
                        // content. A resume still requires checking the prefix
                        // and removing any uncertain partial tail.''')
          section(hook, '  // Override the chunk size (source chars per chunk).', '  chunkCharsOverride?: number;', '''  // Optional source-character chunk budget, used only in chunk mode.
            // The modal uses the shared default for normal and verified pastes.
          ''')
          replace(hook, '  // verified boundary — the resume checkpoint already points there.', '  // checkpoint boundary — target content still requires verification.')
          replace(hook, '  // continue; throw to stop at the (verified) chunk boundary.', '  // continue; throw to stop at the checkpoint, without implying exact content.')
          replace(modal, 'Draining input on target (${progress.completed} / ${progress.total} batches submitted)', 'Waiting for device typing to finish (${progress.completed} / ${progress.total} batches submitted)')
          replace(modal, 'nominal minimum: ${reliableEta}', 'nominal estimate: ${reliableEta}')
          replace(modal, '''                  Chunk {chunkConfirm.chunkIndex} / {chunkConfirm.chunkTotal} delivered — the target
                            should now show{" "}''', '''                  Chunk {chunkConfirm.chunkIndex} / {chunkConfirm.chunkTotal} sent. This paste has
                            reached{" "}''')
          replace(modal, '''                  characters.
                          </p>
                          {chunkConfirm.ocrNote''', '''                  source characters.
                          </p>
                          {chunkConfirm.ocrNote''')
          replace(modal, '''                  Glance at the target&apos;s character counter (e.g. Notepad&apos;s status bar). If
                            it matches, continue. If it doesn&apos;t, stop here — you can trim the tail on the
                            target and resume from this verified point.''', '''                  Check the received text and character count, accounting for any pre-existing
                            text. A matching count does not prove correct content. Stop on a mismatch;
                            verify the prefix and remove any uncertain tail before resuming.''')
          replace(modal, 'Stopped at verified chunk boundary', 'Stopped at chunk checkpoint')
          replace(modal, '                  Paste complete in {formatDuration(completionSummary.elapsedSec)} (', '                  Device typing finished in {formatDuration(completionSummary.elapsedSec)} (')
          replace(modal, '''                      ✓ Verified on target: counter reads{" "}
                                {completionSummary.ocrVerified.expected.toLocaleString()}.''', '''                      Character count matches: {completionSummary.ocrVerified.expected.toLocaleString()}.
                                Content is not independently verified.''')
          replace(modal, '''                  The target should show{" "}
                            <span className="font-bold">{completionSummary.chars.toLocaleString()}</span>{" "}
                            characters / cursor on line{" "}
                            <span className="font-bold">{completionSummary.lines.toLocaleString()}</span>.
                            Compare with the target&apos;s own counter (e.g. Notepad&apos;s status bar) to
                            confirm integrity at a glance.''', '''                  Source: <span className="font-bold">{completionSummary.chars.toLocaleString()}</span>{" "}
                            characters across <span className="font-bold">{completionSummary.lines.toLocaleString()}</span>{" "}
                            lines. Compare the received text with the source; counts alone cannot detect
                            wrong case, substituted symbols or reordering.''')
          replace(modal, '''                  Everything before that point was delivered to the target. Text after it may have
                            partially arrived — check the tail on the target and remove any partial text
                            before resuming.''', '''                  The device finished sending through this checkpoint; application receipt is not
                            guaranteed. Verify the prefix and remove any uncertain partial tail on the
                            target before resuming.''')
          replace(modal, '''          // Auto-verify/repair uses smaller chunks so a repair re-type is
                    // short enough to usually land in a clean window and converge.''', '''          // Use the same bounded chunk budget for normal and verified paste.
                    // Repair convergence is not guaranteed.''')
          PY
      - name: Format and validate final UI
        working-directory: ui
        run: |
          npm ci
          npx prettier --write src/hooks/useKeyboard.ts src/components/popovers/PasteModal.tsx
          npm run test:unit
          npm run typecheck
      - name: Publish reviewed wording to the same branch
        run: |
          git add -- ui/src/hooks/useKeyboard.ts ui/src/components/popovers/PasteModal.tsx
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(paste): distinguish device completion and count checks from content verification'
          git push origin HEAD:refs/heads/fix/reliable-paste-pacing-and-safe-profiles
