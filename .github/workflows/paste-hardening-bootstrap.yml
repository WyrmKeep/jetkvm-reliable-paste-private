name: Paste hardening branch preparation

on:
  push:
    branches: [fix/reliable-paste-pacing-and-safe-profiles]
    paths: [.github/paste-hardening-bootstrap.py]

permissions:
  contents: write

concurrency:
  group: paste-hardening-branch-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'WyrmKeep/jetkvm-reliable-paste-private'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
      - name: Apply asserted, branch-local changes
        run: python3 .github/paste-hardening-bootstrap.py
      - name: Format changed source
        run: |
          gofmt -w paste_pacing.go paste_pacing_test.go internal/pastepacing/*.go hidrpc.go jsonrpc.go
          cd ui
          npm ci
          npx prettier --write src/utils/pasteBatches.ts src/utils/pasteBatches.test.ts src/utils/pasteMacro.ts src/hooks/useKeyboard.ts src/hooks/useKeyboard.paste.test.ts src/hooks/useHidRpc.ts src/components/popovers/PasteModal.tsx src/automation/paste.ts src/automation/paste.test.ts
      - name: Complete UI unit suite and typecheck
        working-directory: ui
        run: |
          npm run test:unit
          npm run typecheck
      - name: Host-safe Go regression and race suites
        run: |
          mkdir -p static && touch static/.gitkeep
          go test -race -tags=hosttest . ./internal/atx ./internal/native ./internal/controlsession ./internal/usbgadget ./internal/pastepacing ./internal/regression
      - name: Publish tested source to this branch only
        run: |
          python3 - <<'PY'
          import json, subprocess
          paths = json.load(open('/tmp/paste-hardening-files.json'))
          paths += ['.github/paste-hardening-bootstrap.py', '.github/workflows/paste-hardening-bootstrap.yml']
          subprocess.run(['git', 'add', '-A', '--', *paths], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'fix(paste): conservative profiles, no catch-up pacing and fail-closed delivery'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/fix/reliable-paste-pacing-and-safe-profiles'], check=True)
          PY
      - name: Capture reviewable patch and changed sources
        if: always()
        run: |
          git diff 968bfd5ab9e55261adf26ab29f5fd8e9966d1782 > /tmp/paste-hardening-review.patch
          python3 - <<'PY'
          import json, pathlib, tarfile
          manifest = pathlib.Path('/tmp/paste-hardening-files.json')
          if manifest.exists():
              with tarfile.open('/tmp/paste-hardening-sources.tar.gz', 'w:gz') as archive:
                  for name in json.loads(manifest.read_text()):
                      if pathlib.Path(name).is_file():
                          archive.add(name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paste-hardening-review
          path: |
            /tmp/paste-hardening-review.patch
            /tmp/paste-hardening-sources.tar.gz
          retention-days: 7
